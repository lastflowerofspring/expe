name: Rise of a Champion — encode to H.265 + upload to R2

on:
  workflow_dispatch:
    inputs:
      start:
        description: "first index (1-based, inclusive)"
        required: true
        default: "1"
      end:
        description: "last index (1-based, inclusive)"
        required: true
        default: "250"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          LINKS_B64: ${{ secrets.COURSE_LINKS_B64 }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          echo "$LINKS_B64" | base64 -d > links.txt
          echo "total links: $(wc -l < links.txt)"
          matrix=$(seq "$START" "$END" | jq -R -s -c 'split("\n")|map(select(length>0))|map({line:(tonumber)})')
          echo "jobs: $(echo "$matrix" | jq 'length')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  encode:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: fetch link
        env:
          LINKS_B64: ${{ secrets.COURSE_LINKS_B64 }}
          LINE: ${{ matrix.item.line }}
        run: |
          set -euo pipefail
          echo "$LINKS_B64" | base64 -d > links.txt
          url=$(sed -n "${LINE}p" links.txt)
          echo "URL_LINE=$url" >> "$GITHUB_ENV"
          printf 'IDX=%03d\n' "$LINE" >> "$GITHUB_ENV"
          echo "index $LINE -> $url"
          rm -f links.txt

      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q --break-system-packages yt-dlp boto3
          yt-dlp --version
          ffmpeg -hide_banner -version | head -1

      - name: download (HLS, retries)
        run: |
          set -euo pipefail
          yt-dlp --referer "https://chessmood.com/" \
                 -f "bestvideo[height<=720]+bestaudio/best[height<=720]" \
                 -N 16 --fragment-retries 10 --retries 10 \
                 -o raw.mp4 "$URL_LINE"
          ls -l raw.mp4

      - name: encode H.265
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -i raw.mp4 \
                 -vcodec libx265 -crf 22 -preset ultrafast \
                 -acodec aac -b:a 80k -tag:v hvc1 out.mp4
          ls -l out.mp4

      - name: upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python3 -c "import os,boto3; from botocore.config import Config; s3=boto3.client('s3',endpoint_url=f\"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com\",aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4'),region_name='auto'); k='course/'+os.environ['IDX']+'.mp4'; s3.upload_file('out.mp4',os.environ['R2_BUCKET'],k,ExtraArgs={'ContentType':'video/mp4'}); print('uploaded',k)"

      - name: delete raw
        if: always()
        run: rm -f raw.mp4 out.mp4
